# Memory containment for the PROD instance (coding-ui.service).
# Install as /etc/systemd/system/coding-ui.service.d/10-memory.conf, then
#   systemctl daemon-reload      # applies to the running unit; does NOT restart
#
# Why: this box has 3.6 GB of RAM and no per-service limits. One `claude -p`
# child is ~330 MB RSS, the node server ~130 MB and the MCP children ~130 MB
# combined, so with MAX_SESSIONS=6 a single instance can reach ~2.1 GB — and
# there are TWO instances (dev + prod). This unit's peak since its last restart
# is only 452 MB (prod sees far fewer concurrent chats than dev — check
# /sys/fs/cgroup/system.slice/coding-ui.service/memory.peak after a busy week
# before tightening further). Without a cap the kernel's OOM killer picks the victim
# box-wide, which is how MariaDB ended up dead for a month on the DB host; with
# one, an overrun is absorbed by the service that caused it.
#
# Sized for MAX_SESSIONS=3 (set in .env):
#   3 x 330 MB (claude) + 130 MB (node) + 130 MB (MCP) ~= 1.25 GB steady state
# MemoryHigh throttles + reclaims above 1.4 GB (no kill, just back-pressure);
# MemoryMax is the hard backstop. If you raise MAX_SESSIONS, raise both by
# ~350 MB per extra session or the cap will start killing claude children.
[Service]
MemoryAccounting=true
MemoryHigh=1400M
MemoryMax=1800M
# A claude child killed by the cgroup OOM must NOT take the whole service down
# with it — the session reaper/evictor already re-spawns sessions on demand.
# If the main node process is the one killed, Restart=on-failure still applies.
OOMPolicy=continue
